name: Release desktop assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk squashfs-tools
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Linux applications
        run: python -m ootrr.tools.build_longshot_app --all --out output/linux
      - name: Build AppImage
        run: |
          curl -fL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 python -m ootrr.tools.build_appimage --appimagetool ./appimagetool --out output/linux/OoTRR-App-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 python -m ootrr.tools.build_appimage --app plando --appimagetool ./appimagetool --out output/linux/OoTRR-Plando-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: output/linux/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows applications
        run: python -m ootrr.tools.build_longshot_app --all --out output/windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: output/windows/*.exe
          if-no-files-found: error

  upload:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets/windows
      - name: Attach all desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/linux/* release-assets/windows/* --clobber